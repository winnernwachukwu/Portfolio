<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Winner.CDC</title>
<style>
:root{--bg:#090d19;--s:#0f1528;--ln:rgba(255,255,255,.1);--tx:#e9ebf2;--mu:#8f98b0;--ac:#c9a24d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 40px}
h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:0}[hidden]{display:none!important}
.wrap{max-width:820px;margin:auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:rgba(9,13,25,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln);padding:10px 0}
.top .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{font-size:20px;margin-right:auto}.top h1 i{color:var(--ac);font-style:normal}
#st{font-size:13px;color:var(--mu)}
button,.bt{font:inherit;font-size:14px;color:var(--tx);background:none;border:1px solid var(--ln);border-radius:99px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.bt:hover{border-color:var(--ac)}.pri{background:var(--tx);color:#090d19;border-color:var(--tx);font-weight:600}.pri:hover{background:var(--ac);border-color:var(--ac)}.sm{padding:5px 11px;font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap}.tabs button.on{background:var(--ac);color:#090d19;border-color:var(--ac)}
.demo{background:#2a2412;border:1px solid var(--ac);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:14px}
.f{margin:0 0 16px}.f label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}textarea{min-height:96px;resize:vertical}input[type=checkbox]{width:22px;height:22px}input[type=file]{margin-top:8px;font-size:14px;padding:8px}
select option{background:#0f1528}.hint{font-size:13px;color:var(--mu);margin:-4px 0 16px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:16px}.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.card .row b{margin-right:auto;font-family:Georgia,serif;font-weight:500}
.lh{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.thumb{width:64px;height:64px;border-radius:12px;background:#1b2244 center/cover;border:1px solid var(--ln);margin-bottom:8px}
.box{max-width:380px;margin:18vh auto 0;padding:0 16px}.box .card{padding:24px}.err{color:#e5636d;font-size:14px;min-height:20px}
.msg{border-bottom:1px solid var(--ln);padding:14px 0}.msg small{color:var(--mu)}.msg p{white-space:pre-wrap;margin:6px 0 10px}
</style></head><body>
<div id="lg" class="box" hidden><div class="card"><h2 style="margin-bottom:6px">Admin</h2><p class="hint" style="margin-top:0">Winner.CDC portfolio</p>
<div class="f"><label>Email</label><input id="le" type="email" autocomplete="username"></div>
<div class="f"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
<button class="pri" onclick="login()">Log in</button><p class="err" id="er"></p></div></div>

<div id="app" hidden>
<div class="top"><div class="wrap"><h1>Winner<i>.</i>CDC admin</h1><span id="st"></span><button class="pri" onclick="save()">Save</button><a class="bt" href="./" target="_blank">View site ↗</a><button onclick="out()" id="so">Sign out</button></div></div>
<div class="wrap"><div class="demo" id="dm" hidden><b>Preview mode.</b> This is how the admin looks. Nothing is saved until Supabase is connected in config.js.</div><div class="tabs" id="tb"></div><div id="mn"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="defaults.js"></script>
<script>
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const C=window.SB||{},DEMO=!C.url,sb=DEMO?null:supabase.createClient(C.url,C.key);
const merge=(d,x)=>{const o={...d};for(const k in x)o[k]=(x[k]&&typeof x[k]==='object'&&!Array.isArray(x[k]))?{...d[k],...x[k]}:x[k];return o};
let D=JSON.parse(JSON.stringify(DEFAULTS)),tab=0,dirty=false;
const gp=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
function sp(o,p,v){const k=p.split('.');let a=o;k.slice(0,-1).forEach(x=>a=a[x]=a[x]||{});a[k[k.length-1]]=v}
const mark=()=>{dirty=true;$('#st').textContent='Unsaved changes'};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* What each tab edits. Fields: [path, type, label, options] (types: text, area, img, file, check, select, list) */
const TH=[[0,'Brand (navy + gold)'],[1,'Trust (blue)'],[2,'Excitement (amber)'],[3,'Calm (green)'],[4,'Pride (red)']];
const S=[
['Profile & links',[
 ['hero.eyebrow','text','Small line above the headline'],
 ['hero.headline','area','Headline (put *stars* around words to colour them, e.g. *backend,*)'],
 ['hero.lead','area','Short intro under the headline'],
 ['links.x','text','X (Twitter) link'],['links.linkedin','text','LinkedIn link'],['links.github','text','GitHub link'],
 ['links.extra','list','More social pages (Instagram, TikTok, YouTube...)',[['label','text','Name, e.g. Instagram'],['url','text','Link']]],
 ['links.cv','file','CV download (paste a link, or upload your PDF)'],
 ['links.email','text','Contact email']]],
['Projects',[['projects','list','Projects (backend and video)',[
 ['type','select','Type',[['tech','Backend / tech project'],['video','Video / creative project']]],
 ['title','text','Project name'],['desc','area','One-line description'],['problem','area','The problem'],['built','area','What I built (backend projects)'],
 ['tags','text','Tags, separated by commas'],['status','select','Status',[['','No badge'],['live','In production (live)'],['wip','In progress'],['concept','Concept']]],['link','text','GitHub link (use "Fill from GitHub" below)'],['live','text','Live website link (fill in when it is in production)'],['video','text','Video link (Google Drive set to "anyone with the link", or YouTube). It plays on the page.'],['ratio','select','Video shape',[['9:16','Vertical (9:16)'],['16:9','Wide (16:9)']]],
 ['image','img','Cover picture (optional)'],
 ['demo','select','Interactive demo on the card',[['','None'],['stock','Stock tracker demo (Ward to Web)'],['phone','Phone video demo (Tap and Shop)']]],
 ['beats','area','Phone demo captions, separated by | (4 lines)']]]]],
['Testimonials',[['testimonials','list','Testimonials',[['q','area','What they said (their real words)'],['n','text','Their name'],['r','text','Role, company'],['p','img','Their photo']]]]],
['Terminal questions',[['faq','list','Questions and answers',[['q','text','Question'],['a','area','Answer'],['go','check','After this answer, open the contact form']]]]],
['Bio & About',[
 ['about.photo','img','Your photo'],['about.h','text','Heading'],['about.q','area','Big opening line'],['about.b','area','Bio paragraph'],
 ['contact.h','text','Contact heading'],['contact.s','text','Contact text'],['contact.photo','img','Round photo at the end']]],
['Process & stack',[
 ['process.backend','list','How I work: backend steps',[['n','text','Step name'],['d','text','What happens'],['w','text','Width (a number, bigger = wider)']]],
 ['process.video','list','How I work: video steps',[['n','text','Step name'],['d','text','What happens'],['w','text','Width (a number, bigger = wider)']]],
 ['stack','list','Stack cards',[['t','text','Title'],['s','text','Small line'],['c','text','Items, separated by commas']]],
 ['marquee.a','text','Moving line 1 (commas)'],['marquee.b','text','Moving line 2 (commas)']]],
['Page colour',[['theme','select','Default colour of the site',TH]]],
['Inbox',null]];

async function up(file){if(!file)return'';if(DEMO)return URL.createObjectURL(file);
 const n=Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');const r=await sb.storage.from('media').upload(n,file,{contentType:file.type});
 if(r.error){alert('Upload failed: '+r.error.message);return''}return sb.storage.from('media').getPublicUrl(n).data.publicUrl}

function fld(label,type,val,set,opts){const w=el('div','f','<label>'+label+'</label>');let i;
 if(type==='area'){i=el('textarea');i.value=val||''}
 else if(type==='select'){i=el('select');opts.forEach(o=>i.add(new Option(o[1],o[0])));i.value=val===undefined?opts[0][0]:val}
 else if(type==='check'){i=el('input');i.type='checkbox';i.checked=!!val}
 else{i=el('input');i.value=val||''}
 i.oninput=i.onchange=()=>{let v=type==='check'?i.checked:i.value;if(type==='select'){const o=opts.find(o=>String(o[0])===v);v=o[0]}set(v);mark()};
 if(type==='img'){const t=el('div','thumb');if(val)t.style.backgroundImage=`url("${val}")`;w.appendChild(t)}
 w.appendChild(i);
 if(type==='img'||type==='file'){const f=el('input');f.type='file';if(type==='img')f.accept='image/*';f.onchange=async()=>{$('#st').textContent='Uploading…';const u=await up(f.files[0]);$('#st').textContent='';if(u){i.value=u;set(u);mark();if(type==='img')show(tab)}};w.appendChild(f)}
 return w}

async function gh(it){const m=(it.link||'').match(/github\.com\/([^\/]+)\/([^\/#?]+)/);if(!m)return alert('Paste a GitHub repo link in the GitHub link box first.');
 try{const r=await fetch('https://api.github.com/repos/'+m[1]+'/'+m[2].replace(/\.git$/,''));if(!r.ok)throw 0;const j=await r.json();
 it.type=it.type||'tech';it.title=it.title||j.name.replace(/[-_]/g,' ');it.desc=it.desc||j.description||'';it.tags=it.tags||[j.language].concat(j.topics||[]).filter(Boolean).join(', ');mark();show(tab)}catch(e){alert('Could not read that repo. Make sure it is public.')}}

function list(path,label,sub){const arr=gp(D,path)||(sp(D,path,[]),gp(D,path));const box=el('div');
 const h=el('div','lh','<h3>'+label+' ('+arr.length+')</h3>');const add=el('button','pri sm','+ Add');add.onclick=()=>{arr.push(path==='projects'?{type:'tech',title:'',desc:'',problem:'',built:'',tags:'',link:'',live:'',status:'wip',video:'',ratio:'9:16',image:'',demo:'',beats:''}:{});mark();show(tab)};h.appendChild(add);box.appendChild(h);
 arr.forEach((it,n)=>{const c=el('div','card');const r=el('div','row','<b>#'+(n+1)+' '+(it.title||it.q||it.n||it.label||it.t||'New')+'</b>');
 const mv=d=>{const j=n+d;if(j<0||j>=arr.length)return;[arr[n],arr[j]]=[arr[j],arr[n]];mark();show(tab)};
 [['↑',()=>mv(-1)],['↓',()=>mv(1)],['Delete',()=>{if(confirm('Delete this?')){arr.splice(n,1);mark();show(tab)}}]].forEach(([t,f])=>{const b=el('button','sm',t);b.onclick=f;r.appendChild(b)});c.appendChild(r);
 sub.forEach(([k,ty,lb,o])=>c.appendChild(fld(lb,ty,it[k],v=>it[k]=v,o)));
 if(path==='projects'){const b=el('button','sm','Fill from GitHub');b.onclick=()=>gh(it);c.appendChild(b)}
 box.appendChild(c)});return box}

function show(k){tab=k;const y=scrollY;$$('#tb button').forEach((b,i)=>b.classList.toggle('on',i===k));const m=$('#mn');m.innerHTML='';const fs=S[k][1];if(!fs){inbox();return}
 fs.forEach(([p,ty,lb,o])=>m.appendChild(ty==='list'?list(p,lb,o):fld(lb,ty,gp(D,p),v=>sp(D,p,v),o)));scrollTo(0,y)}
const $$=s=>[...document.querySelectorAll(s)];
S.forEach((s,i)=>{const b=el('button','',s[0]);b.onclick=()=>show(i);$('#tb').appendChild(b)});

async function inbox(){const m=$('#mn');if(DEMO){m.innerHTML='<p class="hint">Messages from your contact form will appear here once Supabase is connected.</p>';return}
 m.innerHTML='<p class="hint">Loading…</p>';const r=await sb.from('messages').select('*').order('created_at',{ascending:false});
 if(r.error){m.innerHTML='<p class="err">'+r.error.message+'</p>';return}
 m.innerHTML=r.data.length?'':'<p class="hint">No messages yet.</p>';
 r.data.forEach(x=>{const d=el('div','msg');d.appendChild(el('b','',''));d.firstChild.textContent=x.name;d.appendChild(el('small','',''));d.lastChild.textContent=' · '+x.email+' · '+new Date(x.created_at).toLocaleString();
 const p=el('p');p.textContent=x.message;d.appendChild(p);const a=el('a','bt sm','Reply');a.href='mailto:'+x.email;d.appendChild(a);
 const b=el('button','sm','Delete');b.style.marginLeft='8px';b.onclick=async()=>{if(confirm('Delete this message?')){await sb.from('messages').delete().eq('id',x.id);inbox()}};d.appendChild(b);m.appendChild(d)})}

async function save(){if(DEMO){$('#st').textContent='Preview mode: nothing saved';return}
 $('#st').textContent='Saving…';const r=await sb.from('site_content').upsert({id:1,data:D,updated_at:new Date().toISOString()});
 if(r.error){$('#st').textContent='Save failed: '+r.error.message;return}dirty=false;$('#st').textContent='Saved. Live for everyone.'}

async function boot(){$('#lg').hidden=true;$('#app').hidden=false;
 if(!DEMO){const r=await sb.from('site_content').select('data').eq('id',1).maybeSingle();if(r.data&&r.data.data)D=merge(DEFAULTS,r.data.data)}else $('#dm').hidden=false;
 $('#so').hidden=DEMO;show(0)}
async function login(){$('#er').textContent='';const r=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
 if(r.error){$('#er').textContent=r.error.message;return}boot()}
async function out(){await sb.auth.signOut();location.reload()}
(async()=>{if(DEMO)return boot();const s=await sb.auth.getSession();s.data.session?boot():$('#lg').hidden=false})();
</script></body></html>
